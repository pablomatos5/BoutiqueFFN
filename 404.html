  <!-- Página autossuficiente: estilos e panda embutidos, porque ela aparece em qualquer endereço errado (até em subpastas) -->
  <style>
    :root { --noite:#0e1613; --noite-3:#1d2c26; --ouro:#c9a14a; --ouro-claro:#e6c77a; --creme:#f6f3ec; --gradiente:linear-gradient(135deg,#f1d58d 0%,#c9a14a 40%,#8c6b28 60%,#e6c77a 100%); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { min-height:100dvh; display:grid; place-items:center; padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      font-family:Montserrat,system-ui,sans-serif; color:var(--creme); text-align:center; overflow-x:hidden;
      background:radial-gradient(900px 500px at 50% 0%,var(--noite-3),var(--noite) 65%) var(--noite); }
    main { position:relative; z-index:1; display:grid; justify-items:center; gap:14px; max-width:480px; }
    .marca { font-family:Cinzel,serif; letter-spacing:.3em; font-size:.72rem; color:var(--ouro-claro); text-decoration:none; }
    .numero { position:relative; display:flex; align-items:center; justify-content:center; gap:.05em; font-weight:800; font-style:italic; font-size:clamp(5.5rem,30vw,9rem); line-height:1; letter-spacing:-.03em; }
    .numero span { background:var(--gradiente); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .numero img { width:.95em; height:.95em; margin:0 .02em; border-radius:50%; box-shadow:0 14px 34px rgba(0,0,0,.45); animation:procurar 3.2s ease-in-out infinite; }
    @keyframes procurar { 0%,100% { transform:rotate(-8deg) translateY(0); } 50% { transform:rotate(8deg) translateY(-6px); } }
    h1 { margin:6px 0 0; font-family:Cinzel,serif; font-size:clamp(1.3rem,6vw,1.7rem); color:var(--ouro-claro); }
    p { margin:0; color:#d2cdc1; line-height:1.6; }
    .acoes { display:grid; gap:10px; width:100%; margin-top:10px; }
    .btn { display:flex; align-items:center; justify-content:center; min-height:52px; padding:0 20px; border-radius:999px; font-weight:700; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; text-decoration:none; }
    .btn--ouro { background:var(--gradiente); color:var(--noite); box-shadow:0 8px 22px rgba(201,161,74,.35); }
    .btn--linha { border:1.5px solid var(--ouro); color:var(--ouro-claro); }
    .links { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; margin-top:6px; font-size:.82rem; }
    .links a { color:var(--ouro-claro); }
    .bambu { position:fixed; bottom:-10px; width:14px; border-radius:7px; opacity:.22; background:repeating-linear-gradient(180deg,var(--ouro) 0 70px,#8c6b28 70px 74px); }
    .bambu--1 { left:6%; height:70vh; } .bambu--2 { left:calc(6% + 26px); height:52vh; width:10px; } .bambu--3 { right:8%; height:62vh; }
    .folha { position:fixed; top:-20px; left:calc(8% + var(--i) * 16%); width:26px; height:8px; border-radius:100% 0; background:var(--ouro); opacity:0; animation:cair calc(9s + var(--i) * 1.2s) calc(var(--i) * -1.7s) linear infinite; }
    .folha:nth-child(3n) { background:#4f7d60; }
    @keyframes cair { 0% { opacity:0; transform:translate(0,0) rotate(0); } 10% { opacity:.5; } 50% { transform:translate(-30px,50vh) rotate(200deg); } 85% { opacity:.4; } 100% { opacity:0; transform:translate(30px,105vh) rotate(360deg); } }
    @media (min-width:520px) { .acoes { grid-template-columns:1fr 1fr; } }
    @media (prefers-reduced-motion:reduce) { .numero img, .folha { animation:none; } .folha { display:none; } }
